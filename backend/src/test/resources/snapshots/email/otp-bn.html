<p style="margin:0 0 16px;">আপনার কোড নিচে দেওয়া হলো। ৫ মিনিটের মধ্যে ব্যবহার করুন।</p>
<p style="margin:0 0 16px;font-family:Consolas,Menlo,monospace;font-size:28px;font-weight:bold;letter-spacing:6px;color:#0f766e;">482913</p>
<p style="margin:0 0 16px;font-size:13px;color:#71717a;">আপনি এই কোড না চেয়ে থাকলে ইমেইলটি উপেক্ষা করুন। কোডটি কাউকে দেবেন না, এমনকি কেউ নিজেকে মজুদের লোক বললেও না।</p>
</td></tr>
<tr><td style="padding:16px 28px;border-top:1px solid #e4e4e7;font-size:12px;color:#71717a;">এই ইমেইলটি মজুদ থেকে স্বয়ংক্রিয়ভাবে পাঠানো হয়েছে, তাই উত্তর দিলে কেউ পড়বে না।</td></tr>
