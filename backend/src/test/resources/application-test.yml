spring:
  flyway:
    # Adds tables that exist only to test database rules (R__rls_probe.sql).
    locations: classpath:db/migration,classpath:db/testmigration

db-scheduler:
  # Tests run job code themselves, at moments they choose.
  enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mojud:
  security:
    # A fixed test key (SecretBox).
    encryption-key: U7MOZ7FW2dMq6/mVy9thaAjsi3mU3VZUcc0UAqBsbhM=
  web:
    api-base-url: http://localhost:${local.server.port}
  billing:
    # The fake gateway in test sources (support/FakeSslCommerz), on the app's own port.
    sslcommerz:
      base-url: http://localhost:${local.server.port}/api/v1/public/gateway/fake-sslcommerz
      store-id: test-store
      store-password: test-password
  storage:
    # A fresh folder per test run.
    local-root: ${java.io.tmpdir}/mojud-test-storage/${random.uuid}
  async:
    # Messages are sent inline (still after commit), so a test can read a code right away.
    background: false
  sms:
    provider: log
  email:
    provider: log
  identity:
    rate-limits:
      # Every test client comes from 127.0.0.1, so per-IP limits are effectively off here;
      # RateLimiterTest covers the limiter itself.
      login-per-ip: { max: 1000000, window: 15m }
      otp-per-ip: { max: 1000000, window: 1h }
      signup-per-ip: { max: 1000000, window: 1h }
      user-id-check-per-ip: { max: 1000000, window: 1h }

server:
  # Tests set X-Forwarded-For to act as different clients (Tomcat trusts it from localhost only).
  # Production sets this too, behind its proxy (Phase 13b).
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # The test client talks plain http.
        secure: false
