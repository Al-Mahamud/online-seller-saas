# English messages (the default). Every key here must also exist in messages_bn.properties;
# MessagesTest checks that.

# Error codes (ErrorCode): error.<code>
error.validation.failed=One or more fields are invalid.
error.resource.not_found=Not found.
error.resource.modified=Someone else changed this first. Reload it and try again.
error.request.malformed=The request could not be read.
error.route.not_found=There is nothing at this address.
error.method.not_allowed=This action is not allowed here.
error.media_type.unsupported=This content type is not supported.
error.server.error=Something went wrong on our side. Please try again.

# Field errors
field.invalid_value=has an invalid value

# Bean Validation messages, so annotation errors are translated too.
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotEmpty.message=must not be empty
jakarta.validation.constraints.NotNull.message=is required
jakarta.validation.constraints.Size.message=must have between {min} and {max} characters or items
jakarta.validation.constraints.Min.message=must be at least {value}
jakarta.validation.constraints.Max.message=must be at most {value}
jakarta.validation.constraints.Positive.message=must be greater than 0
jakarta.validation.constraints.PositiveOrZero.message=must be 0 or more
jakarta.validation.constraints.Email.message=must be a valid email address
jakarta.validation.constraints.Pattern.message=has an invalid format
