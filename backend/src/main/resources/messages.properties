# English messages (the default). Every key here must also exist in messages_bn.properties;
# MessagesTest checks that.

# Error codes (ErrorCode): error.<code>
error.validation.failed=One or more fields are invalid.
error.resource.not_found=Not found.
error.resource.modified=Someone else changed this first. Reload it and try again.
error.request.malformed=The request could not be read.
error.route.not_found=There is nothing at this address.
error.method.not_allowed=This action is not allowed here.
error.media_type.unsupported=This content type is not supported.
error.server.error=Something went wrong on our side. Please try again.

error.rate_limited=Too many attempts. Please wait a little and try again.
error.auth.required=Please sign in to continue.
error.access.denied=You are not allowed to do this.
error.csrf.invalid=Your session form expired. Reload the page and try again.
error.auth.invalid_credentials=The phone number, email, password or code is wrong.
error.auth.account_disabled=This account is disabled. Please contact support.
error.otp.invalid=The code is wrong or has expired. Request a new one.
error.otp.channel_unavailable=Codes cannot be sent this way yet. Use your email address.
error.account.phone_taken=An account with this phone number already exists.
error.account.email_taken=An account with this email address already exists.
error.account.wrong_password=The current password is wrong.

error.business.not_selected=Choose a business first.
error.business.limit_reached=You can own at most {0} businesses.

error.staff.already_member=This person is already a member of the business.
error.staff.owner_protected=The owner cannot be changed or removed here. Transfer ownership instead.
error.staff.owner_limit=This member already owns {0} businesses, the most allowed.
error.staff.self_change=You cannot change your own role or remove yourself.
error.invite.invalid=This invite is not valid any more. Ask for a new one.
error.invite.wrong_account=This invite was sent to {0}. Sign in with that phone or email, or add it to your account first.
error.invite.channel_unavailable=Invites cannot be sent to this kind of address yet. Try the person's phone number or email instead.

error.category.name_taken=There is already a category with this name here.
error.category.too_deep=Categories go two levels deep: a category and its subcategories.
error.category.not_empty=Only an empty category can be deleted. Move or delete what is in it first.
error.tag.name_taken=There is already a tag with this name.

error.product.sku_taken=Another product already uses this SKU.

error.variant.not_in_options=This variant's option values are no longer in the product's options. Add them back to the options instead.
error.variant.last_active=A product needs at least one active variant. Archive the product instead.

error.file.unsupported=Upload a JPEG, PNG or WebP image.
error.file.too_large=The file is too large. Images can be up to 8 MB.
error.file.image_too_small=Images must be at least {0} x {0} pixels.
error.product.image_limit=A product can have at most 8 images.

# One-time codes. {0} is the code, {1} the minutes it stays valid.
otp.sms=Your Mojud code is {0}. It expires in {1} minutes. Never share it with anyone.
otp.email.subject=Your Mojud code: {0}
otp.email.body=Your Mojud code is {0}. It expires in {1} minutes.\n\nIf you did not ask for this code, you can ignore this email. Never share the code with anyone.

# Staff invites. {0} inviter, {1} business, {2} role, {3} link, {4} days valid.
invite.sms={0} invited you to {1} on Mojud as {2}. Join: {3}
invite.email.subject={0} invited you to {1} on Mojud
invite.email.body={0} invited you to work in {1} on Mojud as {2}.\n\nOpen this link to join: {3}\n\nThe invite expires in {4} days. If you did not expect it, you can ignore this email.

# Role names
role.OWNER=Owner
role.MANAGER=Manager
role.STAFF=Staff

