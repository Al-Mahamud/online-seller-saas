field.value_duplicate=has the same value twice in one option
field.too_many_variants=would make more than 100 variants
field.sku_invalid=may not contain spaces and must be at most 64 characters
field.variant_repeated=lists the same variant twice
field.mapping_column=must name each column of the sheet at most once
field.mapping_field_twice=may use each field only once, except options
