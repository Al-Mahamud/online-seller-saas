field.email_invalid=must be a valid email address
field.six_digit_code=must be the 6-digit code
field.locale_invalid=must be bn (Bangla) or en (English)
field.order_prefix_invalid=may use only A-Z, 0-9 and -, up to 10 characters
field.too_long=is too long
field.order_ids=must list every category in this group exactly once
