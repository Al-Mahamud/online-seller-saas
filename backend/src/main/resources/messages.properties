field.area_not_in_district=must be an area of the district given
field.zones_count=must list between 1 and 20 zones
field.zones_one_default=must have exactly one default zone, for places no zone lists
field.zones_name_twice=has two zones with the same name
field.zones_place_twice=lists a district or area in more than one zone
field.customer_one_of=give either a customerId or a customer (name and phone)
field.order_items_count=must list between 1 and 100 items
field.variant_unavailable=has a product that is not on sale (archived, or not found)
field.discount_too_large=cannot be more than the items' total
field.advance_too_large=cannot be more than the order total
field.order_too_large=makes the order total too large
field.password_or_code=give either a password or a code

