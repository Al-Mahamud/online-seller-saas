# Local development only. Never enable this profile on a server.

mojud:
  security:
    # A fixed key for local runs only (SecretBox); servers set ENCRYPTION_KEY.
    encryption-key: 8ArFd5N5pBs+nsPRMVSU711bIi69acPf+4Pu3NGCL68=
  sms:
    provider: log
  email:
    provider: log
  identity:
    rate-limits:
      # Everything local comes from 127.0.0.1, so per-IP limits would stop a busy session or an
      # end-to-end test run; per-account and per-destination limits stay as configured.
      login-per-ip: { max: 1000000, window: 15m }
      otp-per-ip: { max: 1000000, window: 1h }
      signup-per-ip: { max: 1000000, window: 1h }
      user-id-check-per-ip: { max: 1000000, window: 1h }

server:
  servlet:
    session:
      cookie:
        # Local runs use plain http.
        secure: false
  tomcat:
    # A line in the console for every API call, refused ones too: method, path, status and time. Bodies and
    # query values stay out. Writing to /dev/stdout works on Linux and macOS; on Windows, remove this block.
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""
      buffered: false
      pattern: "API %m %U -> %s (%{ms}T ms)"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # "Try it out" sends the XSRF-TOKEN cookie back as X-XSRF-TOKEN; call GET /api/v1/auth/csrf first.
    csrf:
      enabled: true
