# Local development only. Never enable this profile on a server.

mojud:
  logging:
    # Nearly all of each body (docs/logging.md).
    body-limit: 65536
  admin:
    # The admin area without two-step sign-in, while it is set up (Al Mahamud, Nov 5, 2026). A
    # server refuses to start with this (ProductionChecks).
    require-two-factor: false
  security:
    # A fixed key for local runs only (SecretBox); servers set ENCRYPTION_KEY.
    encryption-key: 8ArFd5N5pBs+nsPRMVSU711bIi69acPf+4Pu3NGCL68=
  sms:
    provider: log
  email:
    provider: log
  identity:
    rate-limits:
      # Everything local comes from 127.0.0.1, so per-IP limits would stop a busy session or an
      # end-to-end test run; per-account and per-destination limits stay as configured.
      login-per-ip: { max: 1000000, window: 15m }
      otp-per-ip: { max: 1000000, window: 1h }
      signup-per-ip: { max: 1000000, window: 1h }
      user-id-check-per-ip: { max: 1000000, window: 1h }

server:
  servlet:
    session:
      cookie:
        # Local runs use plain http.
        secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # "Try it out" sends the XSRF-TOKEN cookie back as X-XSRF-TOKEN; call GET /api/v1/auth/csrf first.
    csrf:
      enabled: true

# Everything, for debugging (docs/logging.md): each SQL statement with its values, Spring's own
# steps, and nearly all of every request and answer body. Servers log INFO and the start of each body.
logging:
  level:
    com.mojud: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.jdbc.core: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    # The connection pool's size every 30 seconds.
    com.zaxxer.hikari.pool.HikariPool: DEBUG
