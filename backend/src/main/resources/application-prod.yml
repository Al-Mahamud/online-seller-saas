# Staging and production servers (deploy/compose.yml). Every secret and address comes from the
# environment (deploy/.env.example); ProductionChecks stops the app if one is missing or unsafe.

server:
  shutdown: graceful
  # Behind Caddy on the same machine: the client's address and https come from X-Forwarded-*
  # headers, which Tomcat accepts only from private addresses (the Docker network).
  forward-headers-strategy: native

spring:
  lifecycle:
    # Requests in progress get this long to finish when the app is stopped for an update.
    timeout-per-shutdown-phase: 25s

logging:
  # One JSON object per line, ready for a log collector.
  structured:
    format:
      console: ecs

mojud:
  storage:
    # Files on Cloudflare R2: the server's disk holds nothing that backups would miss.
    provider: ${STORAGE_PROVIDER:s3}
