spring:
  application:
    name: mojud
  # The application pool connects as mojud_app (row-level security applies); Flyway as the
  # schema owner; the system pool as mojud_system (backend-plan.md §4, db/bootstrap/roles.sql).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mojud}
    username: ${DB_APP_USER:mojud_app}
    password: ${DB_APP_PASSWORD:}
  flyway:
    user: ${DB_OWNER_USER:mojud_owner}
    password: ${DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  messages:
    basename: messages
    encoding: UTF-8
    # Unknown languages fall back to messages.properties (English), not to the server's locale.
    fallback-to-system-locale: false
  jackson:
    time-zone: UTC
  modulith:
    # Spring Modulith's hourly and daily time events are not used; jobs schedule themselves.
    moments:
      enabled: false
    events:
      # V3 creates the table; mojud_app may not create tables.
      jdbc:
        schema-initialization:
          enabled: false
      # Events whose listeners had not finished when the app stopped are delivered again.
      republish-outstanding-events-on-restart: true

db-scheduler:
  # Off on an API-only instance once there are two (backend-plan.md §2, "process layout").
  enabled: ${JOBS_ENABLED:true}

mojud:
  db:
    system:
      url: ${spring.datasource.url}
      username: ${DB_SYSTEM_USER:mojud_system}
      password: ${DB_SYSTEM_PASSWORD:}

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      # Only health is exposed, at /healthz.
      base-path: /
      path-mapping:
        health: healthz
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Off unless asked for: the API description helps attackers as much as developers. The local
  # and test profiles turn it on.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/v1/openapi
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/docs
