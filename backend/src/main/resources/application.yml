spring:
  application:
    name: mojud
  # The application pool connects as mojud_app (row-level security applies); Flyway as the
  # schema owner; the system pool as mojud_system (backend-plan.md §4, db/bootstrap/roles.sql).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mojud}
    username: ${DB_APP_USER:mojud_app}
    password: ${DB_APP_PASSWORD:}
  flyway:
    user: ${DB_OWNER_USER:mojud_owner}
    password: ${DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  messages:
    basename: messages
    encoding: UTF-8
    # Unknown languages fall back to messages.properties (English), not to the server's locale.
    fallback-to-system-locale: false
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # Import sheets up to 10 MB; images are held to 8 MB by FileController.
      max-file-size: 10MB
      max-request-size: 11MB
  session:
    # Idle timeout: a signed-in user stays signed in for a week of inactivity.
    timeout: 7d
    jdbc:
      # V4 creates the session tables.
      initialize-schema: never
  modulith:
    # Spring Modulith's hourly and daily time events are not used; jobs schedule themselves.
    moments:
      enabled: false
    events:
      # V3 creates the table; mojud_app may not create tables.
      jdbc:
        schema-initialization:
          enabled: false
      # Events whose listeners had not finished when the app stopped are delivered again.
      republish-outstanding-events-on-restart: true

db-scheduler:
  # Off on an API-only instance once there are two (backend-plan.md §2, "process layout").
  enabled: ${JOBS_ENABLED:true}

mojud:
  # No SMS gateway yet (backend-plan.md §13). "log" writes messages, codes included, to the log:
  # local runs and tests only.
  sms:
    provider: ${SMS_PROVIDER:none}
  email:
    # "smtp" on servers (any provider: Brevo, Amazon SES, ...); "log" locally; "none" sends nothing.
    provider: ${EMAIL_PROVIDER:none}
    # Like: Mojud <no-reply@your-domain>. Required with smtp.
    from: ${EMAIL_FROM:}
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
  security:
    # Encrypts secrets kept in the database, such as authenticator secrets (SecretBox): 32 random
    # bytes in base64 (openssl rand -base64 32). Keep it outside the database and its backups;
    # without it, two-step sign-in cannot be set up (and platform admins cannot use the admin area).
    encryption-key: ${ENCRYPTION_KEY:}
    # Old keys, comma separated, while rotating: values sealed with them still open, and are
    # re-sealed with the current key at start-up (docs/operations.md, "Rotating secrets").
    previous-encryption-keys: ${ENCRYPTION_KEY_PREVIOUS:}
  identity:
    otp:
      ttl: 5m
      max-attempts: 5
    rate-limits:
      login-per-ip: { max: 100, window: 15m }
      # Counted per failure and cleared by a success (AuthRateLimits).
      login-failures-per-account-and-ip: { max: 10, window: 15m }
      login-failures-per-account: { max: 50, window: 15m }
      signup-per-ip: { max: 20, window: 1h }
      # Each check says whether a User ID exists, so nobody gets to run through a list of them.
      user-id-check-per-ip: { max: 60, window: 1h }
      otp-per-ip: { max: 20, window: 1h }
      otp-cooldown: { max: 1, window: 60s }
      otp-per-destination-and-ip: { max: 5, window: 1h }
      otp-per-destination: { max: 10, window: 1h }
  tenancy:
    invites:
      ttl: 7d
      # Each invite is a message we pay for (SMS) or that could be spam.
      per-business: { max: 30, window: 1d }
  storage:
    # "local" (disk, under local-root) or "s3" (Cloudflare R2 or any S3 API; servers).
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_ROOT:storage}
    s3:
      # R2: https://<account id>.r2.cloudflarestorage.com, region "auto".
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:}
      access-key-id: ${S3_ACCESS_KEY_ID:}
      secret-access-key: ${S3_SECRET_ACCESS_KEY:}
  files:
    # Each upload is stored twice; this keeps one business from filling the disk.
    uploads-per-business: { max: 300, window: 1d }
  billing:
    # VAT on invoices, as a fraction (0.05 is 5%); 0 until the accountant answers (backend-plan.md §9).
    vat-rate: 0
    sslcommerz:
      # The sandbox until going live (https://securepay.sslcommerz.com).
      base-url: ${SSLCOMMERZ_BASE_URL:https://sandbox.sslcommerz.com}
      store-id: ${SSLCOMMERZ_STORE_ID:}
      store-password: ${SSLCOMMERZ_STORE_PASSWORD:}
      # What the gateway's page opens on when the owner picks a wallet in Mojud (its multi_card_name).
      # SSLCommerz documents "bkash"; for Nagad it documents no name, so Nagad opens the mobile wallets
      # ("mobilebank"). If SSLCommerz gives Nagad's own name, set it here.
      wallets:
        bkash: bkash
        nagad: mobilebank
    # Printed on Mojud's invoices to businesses (placeholders until the company's details are final).
    seller:
      name: Mojud
      address: Dhaka, Bangladesh
      bin: ""
    bank-transfer:
      # Shown when an owner chooses to pay by bank transfer; an admin marks the invoice paid on arrival.
      instructions: "Pay by bank transfer to Mojud (account details to be added). Write the invoice number as the reference."
    data-deletion:
      # Deleting the data of businesses read-only for 90 days: off until the wording is approved.
      enabled: false
  imports:
    # Each upload is read and checked in full; this bounds the work one business can cause.
    per-business: { max: 50, window: 1d }
  web:
    # Where the web app lives; invite links point here.
    base-url: ${WEB_BASE_URL:http://localhost:5173}
    # Where this API is reached from outside: payment gateways call back here.
    api-base-url: ${API_BASE_URL:http://localhost:8080}
  db:
    system:
      url: ${spring.datasource.url}
      username: ${DB_SYSTEM_USER:mojud_system}
      password: ${DB_SYSTEM_PASSWORD:}

server:
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    # Read (and discard) a too-large upload up to this size, so the client receives the 413
    # file.too_large answer instead of a dropped connection.
    max-swallow-size: 20MB
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        max-age: 7d

sentry:
  # Errors go to Sentry only with a DSN (servers); local runs and tests send nothing.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  # The image sets APP_VERSION to the commit it was built from.
  release: ${APP_VERSION:dev}
  # No IP addresses, cookies or request bodies: customers' phone numbers and addresses are in them.
  send-default-pii: false
  # Each error is tagged with the request's ID (RequestIdFilter), the one the app shows.
  context-tags: requestId
  logging:
    # Every log.error (unhandled API errors, failed jobs, failed emails) becomes an event.
    minimum-event-level: error
    minimum-breadcrumb-level: info

# The log's format and files are in logback-spring.xml; docs/logging.md explains each part.

management:
  endpoints:
    web:
      # Only health is exposed, at /healthz.
      base-path: /
      path-mapping:
        health: healthz
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Off unless asked for: the API description helps attackers as much as developers. The local
  # and test profiles turn it on.
  # Answers are JSON unless an endpoint says otherwise (CSV exports, printable pages).
  default-produces-media-type: application/json
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/v1/openapi
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/docs
