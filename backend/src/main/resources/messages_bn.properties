# বাংলা বার্তা। messages.properties-এর প্রতিটি key এখানেও থাকতে হবে।

# Error codes (ErrorCode): error.<code>
error.validation.failed=এক বা একাধিক ঘর সঠিকভাবে পূরণ করা হয়নি।
error.resource.not_found=খুঁজে পাওয়া যায়নি।
error.resource.modified=অন্য কেউ আগেই এটি বদলেছেন। আবার লোড করে চেষ্টা করুন।
error.request.malformed=অনুরোধটি পড়া যায়নি।
error.route.not_found=এই ঠিকানায় কিছু নেই।
error.method.not_allowed=এখানে এই কাজটি করা যায় না।
error.media_type.unsupported=এই ধরনের কনটেন্ট সমর্থিত নয়।
error.server.error=আমাদের দিকে একটি সমস্যা হয়েছে। আবার চেষ্টা করুন।

error.rate_limited=অনেকবার চেষ্টা করা হয়েছে। একটু পরে আবার চেষ্টা করুন।
error.auth.required=চালিয়ে যেতে লগ ইন করুন।
error.access.denied=আপনার এই কাজটি করার অনুমতি নেই।
error.csrf.invalid=ফর্মের মেয়াদ শেষ হয়েছে। পেজটি আবার লোড করে চেষ্টা করুন।
error.auth.invalid_credentials=ফোন নম্বর, ইমেইল, পাসওয়ার্ড বা কোড সঠিক নয়।
error.auth.account_disabled=এই অ্যাকাউন্টটি বন্ধ করা আছে। সাপোর্টে যোগাযোগ করুন।
error.otp.invalid=কোডটি ভুল অথবা মেয়াদ শেষ। নতুন কোড নিন।
error.otp.channel_unavailable=এখনও এভাবে কোড পাঠানো যায় না। আপনার ইমেইল ঠিকানা ব্যবহার করুন।
error.account.phone_taken=এই ফোন নম্বরে আগেই একটি অ্যাকাউন্ট আছে।
error.account.email_taken=এই ইমেইল ঠিকানায় আগেই একটি অ্যাকাউন্ট আছে।
error.account.wrong_password=বর্তমান পাসওয়ার্ড সঠিক নয়।

error.business.not_selected=আগে একটি ব্যবসা বেছে নিন।
error.business.limit_reached=আপনি সর্বোচ্চ {0}টি ব্যবসার মালিক হতে পারেন।

error.staff.already_member=এই ব্যক্তি আগে থেকেই ব্যবসার সদস্য।
error.staff.owner_protected=এখানে মালিক বদলানো বা সরানো যায় না। মালিকানা হস্তান্তর করুন।
error.staff.owner_limit=এই সদস্য আগেই {0}টি ব্যবসার মালিক, যা সর্বোচ্চ সীমা।
error.staff.self_change=আপনি নিজের ভূমিকা বদলাতে বা নিজেকে সরাতে পারবেন না।
error.invite.invalid=এই আমন্ত্রণটি আর বৈধ নয়। নতুন আমন্ত্রণ চেয়ে নিন।
error.invite.wrong_account=এই আমন্ত্রণটি {0}-এ পাঠানো হয়েছে। সেই ফোন বা ইমেইল দিয়ে লগ ইন করুন, অথবা আগে সেটি আপনার অ্যাকাউন্টে যোগ করুন।
error.invite.channel_unavailable=এখনও এই ধরনের ঠিকানায় আমন্ত্রণ পাঠানো যায় না। ব্যক্তির ফোন নম্বর বা ইমেইল দিয়ে চেষ্টা করুন।

error.category.name_taken=এখানে এই নামে আগেই একটি ক্যাটাগরি আছে।
error.category.too_deep=ক্যাটাগরি দুই স্তর পর্যন্ত হতে পারে: ক্যাটাগরি ও তার সাব-ক্যাটাগরি।
error.category.not_empty=শুধু খালি ক্যাটাগরি মুছে ফেলা যায়। আগে ভেতরের জিনিস সরান বা মুছুন।
error.tag.name_taken=এই নামে আগেই একটি ট্যাগ আছে।

# One-time codes. {0} is the code, {1} the minutes it stays valid.
otp.sms=আপনার মজুদ কোড {0}। {1} মিনিটের মধ্যে ব্যবহার করুন। কোডটি কাউকে দেবেন না।
otp.email.subject=আপনার মজুদ কোড: {0}
otp.email.body=আপনার মজুদ কোড {0}। {1} মিনিটের মধ্যে ব্যবহার করুন।\n\nআপনি এই কোড না চেয়ে থাকলে ইমেইলটি উপেক্ষা করুন। কোডটি কাউকে দেবেন না।

# Staff invites. {0} inviter, {1} business, {2} role, {3} link, {4} days valid.
invite.sms={0} আপনাকে মজুদে {1}-এ {2} হিসেবে আমন্ত্রণ জানিয়েছেন। যোগ দিন: {3}
invite.email.subject={0} আপনাকে মজুদে {1}-এ আমন্ত্রণ জানিয়েছেন
invite.email.body={0} আপনাকে মজুদে {1}-এ {2} হিসেবে কাজ করার আমন্ত্রণ জানিয়েছেন।\n\nযোগ দিতে এই লিংকটি খুলুন: {3}\n\nআমন্ত্রণটি {4} দিনের মধ্যে শেষ হয়ে যাবে। আপনি এটি আশা না করলে ইমেইলটি উপেক্ষা করুন।

# Role names
role.OWNER=মালিক
role.MANAGER=ম্যানেজার
role.STAFF=স্টাফ

