# বাংলা বার্তা। messages.properties-এর প্রতিটি key এখানেও থাকতে হবে।

# Error codes (ErrorCode): error.<code>
error.validation.failed=এক বা একাধিক ঘর সঠিকভাবে পূরণ করা হয়নি।
error.resource.not_found=খুঁজে পাওয়া যায়নি।
error.resource.modified=অন্য কেউ আগেই এটি বদলেছেন। আবার লোড করে চেষ্টা করুন।
error.request.malformed=অনুরোধটি পড়া যায়নি।
error.route.not_found=এই ঠিকানায় কিছু নেই।
error.method.not_allowed=এখানে এই কাজটি করা যায় না।
error.media_type.unsupported=এই ধরনের কনটেন্ট সমর্থিত নয়।
error.server.error=আমাদের দিকে একটি সমস্যা হয়েছে। আবার চেষ্টা করুন।

# Field errors
field.invalid_value=মান সঠিক নয়

# Bean Validation messages
jakarta.validation.constraints.NotBlank.message=খালি রাখা যাবে না
jakarta.validation.constraints.NotEmpty.message=খালি রাখা যাবে না
jakarta.validation.constraints.NotNull.message=দিতে হবে
jakarta.validation.constraints.Size.message={min} থেকে {max}টি অক্ষর বা আইটেম হতে হবে
jakarta.validation.constraints.Min.message=কমপক্ষে {value} হতে হবে
jakarta.validation.constraints.Max.message=সর্বোচ্চ {value} হতে পারে
jakarta.validation.constraints.Positive.message=০-এর বেশি হতে হবে
jakarta.validation.constraints.PositiveOrZero.message=০ বা তার বেশি হতে হবে
jakarta.validation.constraints.Email.message=সঠিক ইমেইল ঠিকানা দিন
jakarta.validation.constraints.Pattern.message=ফরম্যাট সঠিক নয়
