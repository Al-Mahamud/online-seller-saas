# Known vulnerabilities in what the backend ships (backend-plan.md §11; implementation-plan.md 13c):
# Maven lists the exact libraries the build resolves (a CycloneDX bill of materials, test-only
# libraries excluded), and OSV-Scanner checks them against the OSV database, which includes the
# GitHub and NVD advisories. The web app's lockfile is checked too, build tools included, since
# they run in CI. Fails on any known vulnerability. Weekly, and when dependencies change.
# Dependabot (.github/dependabot.yml) proposes the updates.
name: Dependencies

on:
  push:
    branches: [main]
    paths: ["backend/pom.xml", "frontend/package-lock.json", ".github/workflows/dependencies.yml"]
  pull_request:
    paths: ["backend/pom.xml", "frontend/package-lock.json", ".github/workflows/dependencies.yml"]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: List what the build ships
        working-directory: backend
        run: ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DoutputFormat=json -DoutputName=bom
      - name: Check it for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=backend/target/bom.json
            --lockfile=frontend/package-lock.json
