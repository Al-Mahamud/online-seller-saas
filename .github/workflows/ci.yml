# Every push to main and every pull request: build the backend and the web app and run all their
# tests, end-to-end tests included. On main, the two images are then pushed to GitHub's registry
# (ghcr.io/al-mahamud/mojud-backend and mojud-web), tagged with the commit and "latest"
# (deploy/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B verify

  # The web app (frontend-plan.md, F0): style and lint, types, unit tests, the production build and
  # its size budget. The generated files must match what is committed: the API types
  # (src/api/schema.d.ts, from the backend's API description) and the route tree.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Generated files are up to date
        run: |
          npm run api:types
          if ! git diff --exit-code -- src/api/schema.d.ts src/routeTree.gen.ts; then
            echo "::error::Generated files differ: run npm run api:types and npm run build in frontend/, then commit them"
            exit 1
          fi

  # End to end (frontend-plan.md, F0b): the built web app in Chromium at phone (390 px) and laptop
  # (1280 px) sizes, against the backend with its throwaway database, with an accessibility scan.
  # Playwright starts both servers (frontend/playwright.config.ts). On failure, the report with
  # screenshots and traces is kept as an artifact.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compile the backend first, so its test server starts quickly
        working-directory: backend
        run: ./mvnw -B -q test-compile
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  image:
    needs: [backend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and push the image (amd64 and arm64)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./mvnw -B -q -DskipTests package jib:build -Dapp.version=${{ github.sha }} -Djib.to.tags=latest
          -Djib.to.auth.username="$REGISTRY_USER" -Djib.to.auth.password="$REGISTRY_TOKEN"

  # The web app's image (frontend/Dockerfile): Caddy with the built files.
  web-image:
    needs: [frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image (amd64 and arm64)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          # A repository variable (Settings > Secrets and variables > Actions); empty until there's a project.
          build-args: VITE_SENTRY_DSN=${{ vars.WEB_SENTRY_DSN }}
          push: true
          tags: |
            ghcr.io/al-mahamud/mojud-web:${{ github.sha }}
            ghcr.io/al-mahamud/mojud-web:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
