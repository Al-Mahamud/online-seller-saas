# Every push to main and every pull request: build the backend and run all its tests. On main, the
# server image is then pushed to GitHub's registry (ghcr.io/al-mahamud/mojud-backend), tagged with
# the commit and "latest" (deploy/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B verify

  image:
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and push the image (amd64 and arm64)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./mvnw -B -q -DskipTests package jib:build -Dapp.version=${{ github.sha }} -Djib.to.tags=latest
          -Djib.to.auth.username="$REGISTRY_USER" -Djib.to.auth.password="$REGISTRY_TOKEN"
