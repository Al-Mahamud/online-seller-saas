# Every push to main and every pull request: build the backend and the web app and run all their
# tests. On main, the server image is then pushed to GitHub's registry
# (ghcr.io/al-mahamud/mojud-backend), tagged with the commit and "latest" (deploy/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B verify

  # The web app (frontend-plan.md, F0): style and lint, types, unit tests, the production build and
  # its size budget. The generated files must match what is committed: the API types
  # (src/api/schema.d.ts, from the backend's API description) and the route tree.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Generated files are up to date
        run: |
          npm run api:types
          if ! git diff --exit-code -- src/api/schema.d.ts src/routeTree.gen.ts; then
            echo "::error::Generated files differ: run npm run api:types and npm run build in frontend/, then commit them"
            exit 1
          fi

  image:
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and push the image (amd64 and arm64)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./mvnw -B -q -DskipTests package jib:build -Dapp.version=${{ github.sha }} -Djib.to.tags=latest
          -Djib.to.auth.username="$REGISTRY_USER" -Djib.to.auth.password="$REGISTRY_TOKEN"
