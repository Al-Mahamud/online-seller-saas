# Weekly pull requests for dependency updates; small updates are grouped to keep the noise down.
# Security fixes arrive as soon as GitHub knows of them.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript needs TypeScript 5; and Node's types follow the Node version we run (22).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The server's images (deploy/): PostgreSQL, Caddy, and the backup image's base.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/backup
    schedule:
      interval: weekly
  # The web app image's bases (Node for the build, Caddy to serve).
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
