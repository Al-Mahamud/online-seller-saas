# Weekly pull requests for dependency updates; small updates are grouped to keep the noise down.
# Security fixes arrive as soon as GitHub knows of them.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The server's images (deploy/): PostgreSQL, Caddy, and the backup image's base.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/backup
    schedule:
      interval: weekly
