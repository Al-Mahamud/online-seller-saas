# The Mojud server (implementation-plan.md 13b): the app, PostgreSQL, Caddy (HTTPS) and nightly
# encrypted backups, on one machine with Docker. Settings come from .env next to this file (copy
# .env.example); each service gets only the ones it needs. See README.md.
name: mojud

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Used once, when the data volume is new (db/init.sh).
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-mojud.sh:ro
      # Outside the init folder: init.sh fills in its passwords first.
      - ./db/roles.sql:/mojud/roles.sql:ro
    healthcheck:
      # Over TCP: while it first sets up, PostgreSQL listens on its socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d mojud"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Only the app and the backups reach the database; no port is published.

  app:
    image: ${APP_IMAGE:-ghcr.io/al-mahamud/mojud-backend:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/mojud
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      WEB_BASE_URL: https://${APP_DOMAIN:?}
      API_BASE_URL: https://${APP_DOMAIN:?}
      JOBS_ENABLED: "true"
      # The interactive API documentation stays off on servers.
      API_DOCS_ENABLED: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMS_PROVIDER: none
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_ROOT: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SSLCOMMERZ_BASE_URL: ${SSLCOMMERZ_BASE_URL:-https://sandbox.sslcommerz.com}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    # Reached only through Caddy, on the internal network.
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (certificate notices)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The web app's built files (a placeholder until the frontend exists).
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: mojud
      # The public half of the backup key; the private half stays off this server (README.md).
      AGE_RECIPIENT: ${AGE_RECIPIENT:?set AGE_RECIPIENT in .env (age-keygen)}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-r2:mojud-backups/db}
      BACKUP_AT: ${BACKUP_AT:-20:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      # The "r2" remote for rclone: Cloudflare R2 (a bucket of its own, not the files bucket).
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

volumes:
  db-data:
  caddy-data:
  caddy-config:
